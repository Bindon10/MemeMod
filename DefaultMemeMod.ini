; strike fraction before walls can stop a swing
;MemeWorldMinProgress=0.15
; kick fraction when it strikes
;MemeKickActiveAt=0.3
; parry half-angle from view centre (degrees)
;MemeParryCone=60.0
; guard half-angle (degrees)
;MemeGuardCone=75.0
; shield guard half-angle (degrees)
;MemeShieldCone=85.0
; guard posture cost vs light weapons
;MemeGuardCostLight=12.0
; guard posture cost vs medium weapons
;MemeGuardCostMedium=18.0
; guard posture cost vs heavy weapons
;MemeGuardCostHeavy=26.0
; shield guard cost scale
;MemeShieldGuardScale=0.6
; posture cost of a kick into guard
;MemeKickGuardCost=35.0
; attacker posture lost to a perfect parry
;MemePerfectParryAttackerCost=8.0
; attacker recoil after a perfect parry (s)
;MemeParriedRecoil=0.6
; attacker recoil after a guard block (s)
;MemeBlockedRecoil=0.3
; recoil after a clash (s)
;MemeClashRecoil=0.45
; recoil after hitting a wall (s)
