; Loaded when the server mounts the mod with ?modname=MemeMod.
; DefaultGame's SetGameType (Include/MemeGame.uci) then maps the map prefix to a MemeMod game type.
[Engine.GameInfo]
DefaultGame=MemeMod.MemeModTD

[MemeMod.MemeTuningConfig]
; Uncomment a line to override it. Edits apply on server restart; admins can change them live with MemeTune.
; windup fraction after which feints and morphs are refused
;MCommitFraction=0.6
; server grace on timing checks (s)
;MServerCommitSlack=0.06
; chained windup length scale
;MChainWindupScale=0.9
; riposte windup length scale
;MRiposteWindupScale=0.6
; time after a perfect parry to start a riposte (s)
;MRiposteWindow=0.6
; perfect parry window after pressing block (s)
;MParryWindow=0.25
; recovery scale after contact
;MContactRecoveryScale=0.8
; minimum recovery after a whiffed kick (s)
;MKickWhiffRecovery=0.7
; recovery fraction after which block is allowed
;MRecoveryParryFraction=0.5
; move speed while guarding
;MGuardMoveScale=0.75
; guard drop after blocking something (s)
;MGuardDropTime=0.25
; guard drop after blocking nothing (s)
;MMissedParryRecovery=0.4
; feint recovery (s)
;MFeintTime=0.2
; posture cost of feint, morph, feint into guard
;MFeintCost=10.0
; stagger from an unblocked hit (s)
;MStaggerHit=0.55
; stagger from an unguarded kick (s)
;MStaggerKick=0.7
; stagger from a guard break (s)
;MStaggerBreak=1.1
; stagger fraction after which block is allowed
;MStaggerParryFraction=0.5
; windup turn cap, fraction of vanilla
;MWindupTurn=1.0
; strike turn cap, fraction of vanilla
;MStrikeTurn=0.85
; stab strike sideways turn cap, fraction of vanilla
;MStabStrikeTurn=0.75
; longest delayed release (s), 0 disables
;MHoldMax=0.3
; posture cost of a delayed release
;MHoldCost=6.0
; holding the attack button delays release (MemeHold key always does)
;bMHoldOnAttackButton=true
; blade thickness for hit tests
;MemeBladeRadius=3.0
; blade-to-blade distance that clashes
;MemeClashRadius=6.0
; extra rewind for what remote players see (s)
;MemeProxyDelay=0.03
; rewind cap (s)
;MemeMaxRewind=0.25
; cap on waiting for a defender's block in flight (s)
;MemeMaxHold=0.08
; one-way ping cap (s)
;MemeMaxOneWay=0.15
; release gap that turns a trade into an interrupt (s)
