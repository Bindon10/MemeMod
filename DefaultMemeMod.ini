; guard posture cost vs light weapons
;Tune=MemeGuardCostLight 12.0
; guard posture cost vs medium weapons
;Tune=MemeGuardCostMedium 18.0
; guard posture cost vs heavy weapons
;Tune=MemeGuardCostHeavy 26.0
; shield guard cost scale
